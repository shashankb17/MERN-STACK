<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET AND POST</title>
</head>
<body>
    <h1>GET AND POST</h1>
    <form action="http://localhost:3030/tacos" method="get">
        <h2>GET</h2>
        <input type="text" name = "meat">
        <input type="number" name = "qty">
        <button>Submit</button>
    </form>
    <form action="http://localhost:3030/tacos" method="post">
        <h2>POST</h2>
        <input type="text" name = "meat">
        <input type="number" name = "qty">
        <button>Submit</button>
    </form>
    
</body>
</html>
